spring.application.name=surguess-backend
server.port=${PORT:8080}

# Database Configuration (Heroku Postgres via JDBC_DATABASE_URL or embedded H2 by default)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/surguess;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate (Dialect auto-detected from datasource connection)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.surguess=INFO
logging.level.org.springframework.web.socket=INFO
